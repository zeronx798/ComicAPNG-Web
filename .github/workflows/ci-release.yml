name: Validate, Release, and Deploy

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/') && format('release-{0}', github.ref) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  release_policy:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.policy.outputs.channel }}
      version: ${{ steps.policy.outputs.version }}
      artifact_name: ${{ steps.policy.outputs.artifact_name }}
      archive_name: ${{ steps.policy.outputs.archive_name }}
      release_title: ${{ steps.policy.outputs.release_title }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: policy
        run: node scripts/classify-tag.mjs

  validate:
    needs: release_policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run ci
      - name: Upload exact tested versioned build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.release_policy.outputs.artifact_name }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
      - name: Configure GitHub Pages
        if: needs.release_policy.outputs.channel == 'stable'
        uses: actions/configure-pages@v5
      - name: Upload exact tested Pages build
        if: needs.release_policy.outputs.channel == 'stable'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  release:
    needs: [release_policy, validate]
    if: needs.release_policy.outputs.channel == 'stable' || needs.release_policy.outputs.channel == 'rc'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.release_policy.outputs.artifact_name }}
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.release_policy.outputs.release_title }}
          prerelease: ${{ needs.release_policy.outputs.channel == 'rc' }}
          generate_release_notes: true
          files: release/*

  deploy_pages:
    needs: [release_policy, validate]
    if: needs.release_policy.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact tested stable build
        id: deployment
        uses: actions/deploy-pages@v4
